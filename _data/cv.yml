languages:
  en:
    name: ZHANG Baizhou
    role: PhD Candidate · Architecutural Design, Computational Design
    profile: >-
      PhD candidate at the School of Architecture, Southeast University.
      Research focuses on computational design, generative design, and AI
      applications in architecture, with particular interest in urban form encoding, generative
      urban design and data-driven design workflows.
    show_photo: false
  zh:
    name: 张柏洲
    role: 博士研究生 · 建筑设计及其理论 / 建筑运算与应用
    profile: >-
      东南大学建筑学院博士研究生，主要研究方向为建筑运算与设计应用、生成式设计及人工智能在建筑学中的应用。
      近期研究关注城市形态编码、生成式城市设计与数据驱动的设计工作流。
    show_photo: false


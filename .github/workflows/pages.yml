name: Build and deploy Jekyll site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2.6'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update
      - run: sudo apt-get install -y fonts-noto-cjk poppler-utils unzip
      - run: npm run test:cv
      - run: npm run cv:check
      - run: npm run cv:prepare
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - run: npm run cv:artifacts
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check generated CV files
        run: |
          test -s _site/assets/cv/zhang-baizhou-cv-en.docx
          test -s _site/assets/cv/zhang-baizhou-cv-zh.docx
          test -s _site/assets/cv/zhang-baizhou-cv-en.pdf
          test -s _site/assets/cv/zhang-baizhou-cv-zh.pdf
      - run: unzip -t _site/assets/cv/zhang-baizhou-cv-en.docx
      - run: unzip -t _site/assets/cv/zhang-baizhou-cv-zh.docx
      - run: pdftotext _site/assets/cv/zhang-baizhou-cv-en.pdf - | grep -F "ZHANG Baizhou"
      - run: pdftotext _site/assets/cv/zhang-baizhou-cv-zh.pdf - | grep -F "张柏洲"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
